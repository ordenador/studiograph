<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 160" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">OP-1 field · Lateral derecho</title><desc id="desc">Mirando directamente el lateral: USB-C, entrada, salida y el interruptor en el extremo. Dibujo original basado en documentación del fabricante.</desc><rect x="3" y="21" width="744" height="131" rx="5" fill="#bfc5be" stroke="#858981"/><rect x="5" y="144" width="740" height="5" rx="1" fill="#202620" stroke="#858981"/><text x="22" y="43" fill="#29342e" font-size="15" text-anchor="start">OP-1 field</text><g data-connector-id="usb"><title>USB · USB audio/MIDI, host y device · carga</title><rect x="208" y="89" width="34" height="12" rx="6" fill="#101313" stroke="#858981"/><rect x="214" y="93.5" width="22" height="3" rx="1" fill="#727e76" stroke="#858981"/></g><text x="225" y="73" fill="#29342e" font-size="10" text-anchor="middle">USB</text><g data-connector-id="audio-in"><title>AUDIO IN · 3,5 mm TRS · estéreo</title><circle cx="385" cy="95" r="8" fill="#a4a89b" stroke="#8a8d87" stroke-width="1.5"/><circle cx="385" cy="95" r="5.04" fill="#080c09" stroke="#444e42" stroke-width="1.5"/></g><text x="385" y="73" fill="#29342e" font-size="10" text-anchor="middle">AUDIO IN</text><g data-connector-id="audio-out"><title>AUDIO OUT · 3,5 mm TRS · estéreo / auriculares</title><circle cx="545" cy="95" r="8" fill="#a4a89b" stroke="#8a8d87" stroke-width="1.5"/><circle cx="545" cy="95" r="5.04" fill="#080c09" stroke="#444e42" stroke-width="1.5"/></g><text x="545" y="73" fill="#29342e" font-size="10" text-anchor="middle">AUDIO OUT</text><g data-connector-id="switch"><title>POWER · </title><rect x="688" y="103" width="32" height="14" rx="4" fill="#111512" stroke="#858981"/><rect x="692" y="105" width="10" height="10" rx="2" fill="#d66c3d" stroke="#858981"/></g><text x="704" y="88" fill="#29342e" font-size="10" text-anchor="middle">POWER</text><circle cx="14" cy="131" r="2" fill="#a0a696"