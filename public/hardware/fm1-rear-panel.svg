<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 170" role="img" aria-labelledby="title desc" font-family="system-ui,sans-serif"><title id="title">M-VAVE FM-1 · Trasera</title><desc id="desc">Dibujo común para unidades A/B y referencia de ensayo; no implica firmware ni montaje físico cotejado. Dibujo original basado en documentación del fabricante.</desc><rect x="3" y="21" width="644" height="141" rx="5" fill="#343638" stroke="#858981"/><rect x="5" y="154" width="640" height="5" rx="1" fill="#202620" stroke="#858981"/><text x="22" y="43" fill="#e3e2da" font-size="15" text-anchor="start">M-VAVE FM-1</text><g data-connector-id="audio-out"><title>AUDIO OUT · 3,5 mm TRS · estéreo / auriculares</title><circle cx="85" cy="103" r="8" fill="#a4a89b" stroke="#8a8d87" stroke-width="1.5"/><circle cx="85" cy="103" r="5.04" fill="#080c09" stroke="#444e42" stroke-width="1.5"/></g><text x="85" y="81" fill="#e3e2da" font-size="10" text-anchor="middle">AUDIO OUT</text><g data-connector-id="midi-in"><title>MIDI IN · MIDI TRS de 3,5 mm · el manual no especifica tipo A/B</title><circle cx="245" cy="103" r="8" fill="#a4a89b" stroke="#8a8d87" stroke-width="1.5"/><circle cx="245" cy="103" r="5.04" fill="#080c09" stroke="#444e42" stroke-width="1.5"/></g><text x="245" y="81" fill="#e3e2da" font-size="10" text-anchor="middle">MIDI IN</text><g data-connector-id="usb"><title>USB · USB MIDI · alimentación</title><rect x="388" y="97" width="34" height="12" rx="6" fill="#101313" stroke="#858981"/><rect x="394" y="101.5" width="22" height="3" rx="1" fill="#727e76" stroke="#858981"/></g><text x="405" y="81" fill="#e3e2da" font-size="10" text-anchor="middle">USB</text><g data-connector-id="switch"><title>POWER · </title><circle cx="555" cy="103" r="12" fill="#141714" stroke="#8a8d87" stroke-width="1.5"/><text x="555" y="107" fill="#e0e1d7" font-size="13" text-anchor="middle">⏻</text></g><text x="555" y="81" fill="#e3e2da" font-size="10" text-anchor="middle">POWER</text><circle cx="14" cy="14